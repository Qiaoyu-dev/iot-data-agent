# 一键起后端(api) + 前端(web)，数据卷持久化，密钥从 .env 读
services:
  api:                          # 后端 FastAPI
    build: .
    container_name: iot-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env                    # 读 DEEPSEEK_API_KEY / ZHIPU_API_KEY
    volumes:
      - ./data:/app/data                    # 知识库 md + 传感器 csv
      - ./chroma_db:/app/chroma_db          # 向量库持久化，重启不丢
    command: >
      sh -c "python -m rag.build_index &&
               uvicorn api.main:app --host 0.0.0.0 --port 8000"

  web:                          # 前端 Streamlit
    build: .
    container_name: iot-agent-web
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8000   # 容器内用服务名，不是 127.0.0.1
    command: ["streamlit", "run", "web/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]